name: Verify and publish Blend

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the foundation
        run: |
          openssl rand -hex 32 > .env.db-password
          chmod 644 .env.db-password
          docker compose up -d --build
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Print diagnostics
        if: failure()
        run: docker compose ps -a
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
      - name: Publish verified release image
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag blend:local "$image"
          docker push "$image"
